x-rbportal-env: &rbportal-env
  # Build mode runs the rehearsal target's installed production graph.
  NODE_ENV: production
  REDBOX_APPLICATION_CONFIG: /deployment/application.cjs
  REDBOX_PORT: 1500
  REDBOX_HOSTNAME: 0.0.0.0
  REDBOX_PUBLIC_URL: '${REDBOX_PUBLIC_URL:-${APP_URL:-http://localhost:1500}}'
  REDBOX_MONGODB_URL: mongodb://mongodb:27017/redbox-portal
  REDBOX_STORAGE_MONGODB_URL: mongodb://mongodb:27017/redbox-storage
  REDBOX_SESSION_MONGODB_URL: mongodb://mongodb:27017/sessions-v6
  REDBOX_AGENDA_MONGODB_URL: mongodb://mongodb:27017/redbox-agenda
  REDBOX_SESSION_SECRET: '${REDBOX_SESSION_SECRET:?Set REDBOX_SESSION_SECRET to at least 32 characters}'
  REDBOX_ADMIN_PASSWORD: '${REDBOX_ADMIN_PASSWORD:-rbadmin}'
  REDBOX_ADMIN_TOKEN: '${REDBOX_ADMIN_TOKEN:-c8e844fc-8550-497f-b970-7900ec8741ca}'
  # Optional providers are converted by the explicit development config module.
  UPPY_COMPANION_ENABLED: '${UPPY_COMPANION_ENABLED:-false}'
  UPPY_COMPANION_SECRET: '${UPPY_COMPANION_SECRET:-dev-local-companion-secret-2026-02-16}'
  UPPY_COMPANION_BEARER_TOKEN: '${UPPY_COMPANION_BEARER_TOKEN:-}'
  UPPY_COMPANION_ATTACHMENT_SECRET: '${UPPY_COMPANION_ATTACHMENT_SECRET:-${UPPY_COMPANION_SECRET:-dev-local-companion-secret-2026-02-16}}'
  UPPY_COMPANION_UPLOAD_URLS: '${UPPY_COMPANION_UPLOAD_URLS:-^https?://(localhost|127\\.0\\.0\\.1):1500(?:/[^/]+/[^/]+)?/companion/record/.+/attach$}'
  UPPY_GOOGLE_KEY: '${UPPY_GOOGLE_KEY:-}'
  UPPY_GOOGLE_SECRET: '${UPPY_GOOGLE_SECRET:-}'
  UPPY_ONEDRIVE_KEY: '${UPPY_ONEDRIVE_KEY:-}'
  UPPY_ONEDRIVE_SECRET: '${UPPY_ONEDRIVE_SECRET:-}'
  UPPY_COMPANION_HOST: '${UPPY_COMPANION_HOST:-localhost:1500}'
  UPPY_COMPANION_PROTOCOL: '${UPPY_COMPANION_PROTOCOL:-http}'

x-rbportal-volumes: &rbportal-volumes
  - '${RBPORTAL_DEV_DATA_DIR:-./.dev}/attachments:/attachments:delegated'
  - '${RBPORTAL_DEV_DATA_DIR:-./.dev}/publication:/publication:delegated'
  - '${RBPORTAL_DEV_DATA_DIR:-./.dev}/hooks:/opt/hooks:delegated'
  - './application.cjs:/deployment/application.cjs:ro'
  - '../resources/development/bootstrap-data:/opt/redbox-portal/bootstrap-data:ro'

x-rbportal-service: &rbportal-service
  environment: *rbportal-env
  ports:
    - '127.0.0.1:${RBPORTAL_HTTP_PORT:-1500}:1500'
    # Debugging port
    - '127.0.0.1:${RBPORTAL_DEBUG_PORT:-9876}:9876'
  depends_on:
    mongodb:
      condition: service_healthy
    solr:
      condition: service_healthy
  networks:
    main:
      aliases:
        - rbportal
  init: true
  stop_grace_period: 60s
  entrypoint: ["node", "--enable-source-maps", "--inspect=0.0.0.0:9876", "app.express.cjs"]
  command: []

networks:
  main:

services:
  rbportal-mount:
    <<: *rbportal-service
    profiles: [mount]
    environment:
      <<: *rbportal-env
      # The mounted workspace includes its development dependencies/hooks.
      NODE_ENV: development
    image: ${RBPORTAL_IMAGE:-redbox-portal:dev}
    build:
      context: ../..
      dockerfile: Dockerfile
      target: rehearsal
    volumes:
      - '../../:/opt/redbox-portal:delegated'
      - '${RBPORTAL_DEV_DATA_DIR:-./.dev}/attachments:/attachments:delegated'
      - '${RBPORTAL_DEV_DATA_DIR:-./.dev}/publication:/publication:delegated'
      - '${RBPORTAL_DEV_DATA_DIR:-./.dev}/hooks:/opt/hooks:delegated'
      - './application.cjs:/deployment/application.cjs:ro'
      - '../resources/development/bootstrap-data:/opt/redbox-portal/bootstrap-data:ro'
  rbportal-build:
    <<: *rbportal-service
    profiles: [build]
    build:
      context: ../..
      dockerfile: Dockerfile
      target: rehearsal
    image: ${RBPORTAL_IMAGE:-redbox-portal:dev}
    volumes: *rbportal-volumes
  mongodb:
    # New stacks only: see support/specs/prisma-cache-persistence/p4-validation.md
    # before reusing data from an older or newer server/FCV.
    image: mongo:9.0.4@sha256:dc28ed5a9d0fc616903c3f463bb1e53b92b49f441721b91926e87d90bf957ce8
    ulimits:
      nofile:
        soft: 64000
        hard: 64000
    volumes:
      - '../resources/mongodb-persistence-indexes.js:/docker-entrypoint-initdb.d/20-persistence-indexes.js:ro'
      - './mongodb-runtime-indexes.js:/docker-entrypoint-initdb.d/30-runtime-indexes.js:ro'
      - '${RBPORTAL_DEV_DATA_DIR:-./.dev}/devdata:/devdata:delegated'
      - '${RBPORTAL_DEV_DATA_DIR:-./.dev}/mongo/data/db:/data/db:delegated'
      - '${RBPORTAL_DEV_DATA_DIR:-./.dev}/log/mongo:/var/log/mongo:delegated'
    networks:
      main:
        aliases:
          - mongodb
    ports:
      - '127.0.0.1:${RBPORTAL_MONGO_PORT:-27017}:27017'
    # The temporary init server binds loopback only. Probe the network alias so
    # healthy means all fresh-volume DDL completed and the final server started.
    healthcheck:
      test: [CMD, mongosh, 'mongodb://mongodb:27017/admin?serverSelectionTimeoutMS=2000', --quiet, --eval, 'quit(db.adminCommand({ ping: 1 }).ok ? 0 : 1)']
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s
  solr:
    image: solr:10.0.0@sha256:c2a983cd9a5759c3b802b7b47f48b5cfae2b34d63a9444d62730fdbdb1b5308b
    expose:
      - '8983'
    ports:
      - '127.0.0.1:${RBPORTAL_SOLR_PORT:-8983}:8983'
    healthcheck:
      test: [CMD, curl, -fsS, 'http://localhost:8983/solr/redbox/admin/ping']
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s
    # Example of pre create additional solr cores that needs to be coupled with correct record type configuration
    # volumes:
    #  - "../integration-testing/solr.in.sh:/etc/default/solr.in.sh"
    networks:
      main:
        aliases:
          - solr
    entrypoint:
      - docker-entrypoint.sh
      - solr-precreate
      - redbox
      - /opt/solr/server/solr/configsets/_default
