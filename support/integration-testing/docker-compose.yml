networks:
  main:
services:
  redboxportal:

    image: qcifengineering/redbox-portal:latest
    ports:
       - "1500:1500"
    volumes:
       - "../../:/opt/redbox-portal"
       - "../../.tmp/attachments:/attachments"
    expose:
       - "1500"
    environment:
      - NODE_ENV=integrationtest
      - PORT=1500
    networks:
     main:
       aliases:
         - rbportal
    init: true
    entrypoint: /bin/bash -c "cd /opt/redbox-portal && node app.js"
  mongodb:
    volumes:
      - '../resources/mongodb-persistence-indexes.js:/docker-entrypoint-initdb.d/20-persistence-indexes.js:ro'
    image: mongo:9.0.4@sha256:dc28ed5a9d0fc616903c3f463bb1e53b92b49f441721b91926e87d90bf957ce8
    networks:
      main:
        aliases:
          - mongodb
    ports:
       - "27017:27017"
  solr:
    image: solr:10.0.0
    expose:
      - "8983"
    ports:
      - "8983:8983"
    environment:
      - SOLR_HOME=/var/solr/data
    # volumes:
      # Please do before: sudo chown 8983:8983 /mnt/data/solr
      # - "/mnt/data/solr:/var/solr/data"
    networks:
      main:
       aliases:
         - solr
    entrypoint:
      - docker-entrypoint.sh
      - solr-precreate
      - redbox
