# Opt-in only: use AFTER docker-compose.mocha.yml, with --profile portal.
# Requires Docker Compose >= 2.24.4 (!override replaces rather than merges mounts).
# The test image must satisfy support/build/ci-prebuilt-compose.md first.
services:
  redboxportal:
    # Local content-addressed image ID from the independently verified CI candidate.
    # Never fall back to the base file's mutable development image tag.
    image: 'sha256:${RBPORTAL_CI_IMAGE_SHA256:?Set the verified local test image ID without its sha256 prefix}'
    pull_policy: never
    volumes: !override
      - '../../coverage/mocha:/tmp/coverage/mocha'
      - '../../.tmp/junit/backend-mocha:/opt/redbox-portal/.tmp/junit/backend-mocha'
      - '../../.tmp/attachments:/attachments'
    # Explicit values prevent host credentials/live-test opt-ins reaching CI.
    environment: !override
      NODE_ENV: integrationtest
      PORT: '1500'
      sails_redbox__apiKey: c8e844fc-8550-497f-b970-7900ec8741ca
      sails_record__baseUrl_redbox: http://redbox:9000/redbox
      sails_record__baseUrl_mint: http://203.101.226.160/mint
      sails_redbox__mochaTesting: 'true'
      sails_brandingConfigurationDefaults__auth__local__default__token: d077835a-696b-4728-85cf-3ffd57152b1e
      sails_security__csrf: 'false'
      LOAD_DEFAULT_FORMS: 'true'
      datacite_username: ''
      datacite_password: ''
      datacite_doiPrefix: ''
      datacite_baseUrl: ''
      RUN_LIVE_INTEGRATION_TESTS: 'false'
      CI: 'true'
      RBPORTAL_REUSE_PREBUILT_ASSETS: 'true'
      RBPORTAL_EXPECTED_IMAGE_REVISION: '${RBPORTAL_EXPECTED_IMAGE_REVISION:?Set the full tested checkout revision independently of image metadata}'
      RBPORTAL_MOCHA_TEST_PATHS: '${RBPORTAL_MOCHA_TEST_PATHS:-}'
      RBPORTAL_COVERAGE_DIR: /tmp/coverage/mocha
      sails_recordSchema__unknownProperties: allow
