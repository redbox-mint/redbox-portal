
networks:
  main:

services:
  bruno:
    image: node:26.11.1-bookworm@sha256:f1233c415b41ffcf237c717b3dea92e9d4ea006e0e4c71edcb790605d74f5404
    pull_policy: 'missing'
    volumes:
      - "../../.tmp/junit/backend-bruno:/opt/junit/backend-bruno"
      - "../../test/bruno:/opt/bruno-tests"
    working_dir: /opt/bruno-tests
    depends_on:
      redboxportal:
        condition: service_healthy
    networks:
     main:
       aliases:
         - bruno
    entrypoint: >-
      /bin/sh -lc "cd /opt/bruno-tests &&
      npm ci --ignore-scripts &&
      node_modules/.bin/bru run
      --env int-test
      --format junit
      --output /opt/junit/backend-bruno/backend-bruno.xml
      --bail"
  redboxportal:
    image: ${RBPORTAL_IMAGE:-qcifengineering/redbox-portal:develop}
    pull_policy: 'missing'
    user: root
      # Debugging port (publish only when debugging locally)
      # ports:
      #   - "9876:9876"
    volumes:
       - "../..:/opt/redbox-portal"
       - "../../.tmp/attachments:/attachments"
    healthcheck:
      test: ["CMD-SHELL", "curl http://localhost:1500/default/rdmp/home"]
      interval: '10s'
      timeout: '5s'
      retries: 10
      start_period: '60s'
    depends_on:
      keycloak:
        condition: 'service_healthy'
      mongodb:
        condition: 'service_healthy'
      solr:
        condition: 'service_healthy'
      email:
        condition: 'service_healthy'
    expose:
       - "1500"
    environment:
      - NODE_ENV=integrationtest
      - RBPORTAL_EXPRESS_TEST_PROFILE=general
      - REDBOX_APPLICATION_CONFIG=/opt/redbox-portal/support/integration-testing/express-integration.config.cjs
      - REDBOX_SESSION_SECRET=integrationtest-only-v6-session-secret-at-least-32
      - PORT=1500
      - NODE_OPTIONS=--max-old-space-size=1024
      - LOAD_DEFAULT_FORMS=true
    networks:
     main:
       aliases:
         - redboxportal
    # add 'node --inspect=0.0.0.0:9876' for debugging locally
    init: true
    entrypoint: [bash, /opt/redbox-portal/support/integration-testing/run-bruno-general-redbox.sh]
  mongodb:
    ulimits:
      nofile:
        soft: 64000
        hard: 64000
    volumes:
      - '../resources/mongodb-persistence-indexes.js:/docker-entrypoint-initdb.d/20-persistence-indexes.js:ro'
    image: mongo:9.0.4@sha256:dc28ed5a9d0fc616903c3f463bb1e53b92b49f441721b91926e87d90bf957ce8
    pull_policy: 'missing'
    networks:
      main:
        aliases:
          - mongodb
    # No published ports needed in CI
    healthcheck:
      test: [ 'CMD-SHELL', "echo 'db.runCommand(\"ping\").ok' | mongosh" ]
      interval: '10s'
      timeout: '5s'
      retries: 10
      start_period: '30s'
  solr:
    image: solr:latest@sha256:4316295f16175f676ac6798769f7a21729131ab555f1ba8663839dd7abd92e13
    pull_policy: 'missing'
    expose:
      - "8983"
    # No published ports needed in CI
    healthcheck:
      test: [ 'CMD-SHELL', 'curl http://localhost:8983' ]
      interval: '10s'
      timeout: '5s'
      retries: 10
      start_period: '30s'
    networks:
      main:
       aliases:
         - solr
    entrypoint:
      - docker-entrypoint.sh
      - solr-precreate
      - redbox
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1-0
    pull_policy: 'missing'
    expose:
      - "8080"
    # No published ports needed in CI
    healthcheck:
      test: ["CMD-SHELL", "/usr/bin/bash -c 'true </dev/tcp/127.0.0.1/8080'"]
      interval: '10s'
      timeout: '5s'
      retries: 10
      start_period: '30s'
    volumes:
      - "./keycloakdb/import:/opt/keycloak/data/import:ro"
    networks:
      main:
       aliases:
         - keycloak
    command:
      - start-dev
      - --import-realm
  email:
    image: axllent/mailpit:latest@sha256:23fe39e81bde596a918000b3135c0f85dc8bb4c9ea6be274b051143f3e300387
    pull_policy: 'missing'
    expose:
      - '1025'
      - '8025'
    # No published ports needed in CI
    environment:
      MP_MAX_MESSAGES: 5000
      MP_DATABASE: '/data/mailpit.db'
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
      TZ: 'Australia/Brisbane'
    volumes:
      - '../../.tmp/email:/data'
    networks:
      main:
        aliases:
          - 'email'
