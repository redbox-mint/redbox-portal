networks:
  main:

x-rbportal-env: &rbportal-env
  - NODE_ENV=integrationtest
  - RBPORTAL_EXPRESS_TEST_PROFILE=mocha
  - REDBOX_APPLICATION_CONFIG=/opt/redbox-portal/support/integration-testing/express-integration.config.cjs
  - REDBOX_SESSION_SECRET=integrationtest-only-v6-session-secret-at-least-32
  - PORT=1500
  - LOAD_DEFAULT_FORMS=true
  - datacite_username=${datacite_username:-}
  - datacite_password=${datacite_password:-}
  - datacite_doiPrefix=${datacite_doiPrefix:-}
  - RUN_LIVE_INTEGRATION_TESTS=${RUN_LIVE_INTEGRATION_TESTS:-false}
  - CI=${CI:-false}
  - RBPORTAL_MOCHA_TEST_PATHS=${RBPORTAL_MOCHA_TEST_PATHS:-}
  - RBPORTAL_COVERAGE_DIR=/tmp/coverage/mocha

x-rbportal-depends: &rbportal-depends
  keycloak:
    condition: 'service_healthy'
  mongodb:
    condition: 'service_healthy'
  solr:
    condition: 'service_healthy'
  email:
    condition: 'service_healthy'

x-rbportal-service: &rbportal-service
  image: ${RBPORTAL_IMAGE:-qcifengineering/redbox-portal:develop}
  pull_policy: 'missing'
  volumes:
    - '../../test:/opt/redbox-portal/test'
    - '../../support:/opt/redbox-portal/support'
    - '../../typescript:/opt/redbox-portal/typescript'
    - '../../coverage/mocha:/tmp/coverage/mocha'
    - '../../.tmp/junit/backend-mocha:/opt/redbox-portal/.tmp/junit/backend-mocha'
    - '../../.tmp/attachments:/attachments'
    - '../../tsconfig.json:/opt/redbox-portal/tsconfig.json'
    - '../resources/development/bootstrap-data:/opt/redbox-portal/bootstrap-data:ro'
  depends_on: *rbportal-depends
  expose:
    - '1500'
  environment: *rbportal-env
  networks:
    main:
      aliases:
        - redboxportal
  init: true
  entrypoint:
    - bash
    - /opt/redbox-portal/support/integration-testing/run-mocha-redbox.sh

services:
  redboxportal:
    <<: *rbportal-service
    profiles: [portal]
    user: '${UID:-1000}:${GID:-1000}'
  redboxportal-mount:
    <<: *rbportal-service
    profiles: [mount]
    ports: []
    volumes:
      - '../../:/opt/redbox-portal:delegated'
      - '../../.tmp/attachments:/attachments'
      - '../resources/development/bootstrap-data:/opt/redbox-portal/bootstrap-data:ro'
  mongodb:
    volumes:
      - '../resources/mongodb-persistence-indexes.js:/docker-entrypoint-initdb.d/20-persistence-indexes.js:ro'
    image: mongo:9.0.4@sha256:dc28ed5a9d0fc616903c3f463bb1e53b92b49f441721b91926e87d90bf957ce8
    pull_policy: 'always'
    networks:
      main:
        aliases:
          - mongodb
    healthcheck:
      test: ['CMD-SHELL', 'echo ''db.runCommand("ping").ok'' | mongosh']
      interval: '10s'
      timeout: '5s'
      retries: 10
      start_period: '30s'
  solr:
    image: solr:latest@sha256:4316295f16175f676ac6798769f7a21729131ab555f1ba8663839dd7abd92e13
    pull_policy: 'always'
    expose:
      - '8983'
    healthcheck:
      test: ['CMD-SHELL', 'curl http://localhost:8983']
      interval: '10s'
      timeout: '5s'
      retries: 10
      start_period: '30s'
    volumes:
      - './solr.in.sh:/etc/default/solr.in.sh'
    networks:
      main:
        aliases:
          - solr
    entrypoint:
      - docker-entrypoint.sh
      - solr-precreate
      - redbox
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1-0
    pull_policy: 'always'
    expose:
      - '8080'
    healthcheck:
      test: ['CMD-SHELL', "/usr/bin/bash -c 'true </dev/tcp/127.0.0.1/8080'"]
      interval: '10s'
      timeout: '5s'
      retries: 10
      start_period: '30s'
    volumes:
      - './keycloakdb/import:/opt/keycloak/data/import:ro'
    networks:
      main:
        aliases:
          - keycloak
    command:
      - start-dev
      - --import-realm
  email:
    image: axllent/mailpit:latest@sha256:98b916bd3c8d61f7633a52d3ea2f58d00620cb01ca57ab59edde68c347a95365
    pull_policy: 'always'
    expose:
      - '1025'
      - '8025'
    environment:
      MP_MAX_MESSAGES: 5000
      MP_DATABASE: '/data/mailpit.db'
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
      TZ: 'Australia/Brisbane'
    volumes:
      - '../../.tmp/email:/data'
    networks:
      main:
        aliases:
          - 'email'
          - 'integration-testing-email-1'
