services:
  mongodb:
    image: mongo:9.0.4@sha256:dc28ed5a9d0fc616903c3f463bb1e53b92b49f441721b91926e87d90bf957ce8
    ports: ['127.0.0.1::27017']
    mem_limit: 1536m
    command: ['mongod', '--bind_ip_all', '--wiredTigerCacheSizeGB', '0.25']
    healthcheck:
      test: ['CMD-SHELL', 'mongosh --quiet --eval "quit(db.runCommand({ping:1}).ok ? 0 : 1)"']
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
