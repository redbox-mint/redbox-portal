volumes:
  c2-email:
  c2-attachments:
  c2-uploads:
services:
  email:
    volumes: !override
      - c2-email:/data
    networks:
      main:
        aliases:
          - integration-testing-email-1
  redboxportal-mount:
    volumes:
      - c2-attachments:/attachments
      - c2-uploads:/opt/redbox-portal/.tmp/uploads
    environment:
      NODE_OPTIONS: --max-old-space-size=1024 --require /opt/redbox-portal/packages/redbox-core/test/fixtures/cache-persistence/c2-upload-observer.cjs
