version: 2
updates:
  # Update Dockerfile files
  - package-ecosystem: 'docker'
    directory: '/'
    schedule:
      interval: 'daily'
    target-branch: 'develop'
    cooldown:
      default-days: 7

  # Update docker compose files
  - package-ecosystem: 'docker-compose'
    directories:
      - '/support/development'
      - '/support/integration-testing'
      - '/packages/sails-hook-redbox-storage-mongo/support'
    schedule:
      interval: 'daily'
    target-branch: 'develop'
    cooldown:
      default-days: 7

  # Update github actions files
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'daily'
    target-branch: 'develop'
    cooldown:
      default-days: 7

  # Update package npm files
  - package-ecosystem: 'npm'
    directories:
      - '/'
      - '/packages/raido'
      - '/packages/redbox-core'
      - '/packages/redbox-dev-tools'
      - '/packages/rva-registry'
      - '/packages/sails-hook-redbox-storage-mongo'
      - '/packages/sails-ng-common'
      - '/packages/redbox-hook-dev'
      - '/packages/agenda-sqs-backend'
      - '/angular'
      - '/angular/projects/researchdatabox/portal-ng-common'
      - '/angular/projects/researchdatabox/portal-ng-form-custom'
    schedule:
      interval: 'daily'
    target-branch: 'develop'
    # Vitest packages declare exact peer versions, so keep their updates
    # together to preserve strict-peer-deps installability.
    groups:
      vitest:
        applies-to: 'version-updates'
        patterns:
          - 'vitest'
          - '@vitest/*'
      uppy:
        applies-to: 'version-updates'
        patterns:
          - '@uppy/*'
      # Update Angular dependencies as a group, with one PR having minor and
      # patch changes and a separate PR for major version changes.
      tiptap:
        applies-to: 'version-updates'
        patterns:
          - '@tiptap/*'
          - 'ngx-tiptap'
        update-types:
          - 'minor'
          - 'patch'
      tiptap-major:
        applies-to: 'version-updates'
        patterns:
          - '@tiptap/*'
          - 'ngx-tiptap'
        update-types:
          - 'major'
      angular:
        applies-to: 'version-updates'
        group-by: 'dependency-name'
        patterns:
          - '@angular/*'
          - '@angular-devkit/*'
          - 'ngx-bootstrap'
          - '@schematics/angular'
          - 'ng-packagr'
          - '@ngx-formly/*'
          - '@ngrx/*'
        update-types:
          - 'minor'
          - 'patch'
      angular-major:
        applies-to: 'version-updates'
        group-by: 'dependency-name'
        patterns:
          - '@angular/*'
          - '@angular-devkit/*'
          - 'ngx-bootstrap'
          - '@schematics/angular'
          - 'ng-packagr'
          - '@ngx-formly/*'
          - '@ngrx/*'
        update-types:
          - 'major'
    cooldown:
      default-days: 7
    # Jasmine 7 freezes its Env methods, which prevents Zone.js from applying
    # the monkey patches required by the Angular Karma test runner.
    ignore:
      - dependency-name: 'jasmine-core'
        update-types:
          - 'version-update:semver-major'

  # Update support npm files
  - package-ecosystem: 'npm'
    directories:
      - '/support/build/api-descriptors'
      - '/test/bruno'
    schedule:
      interval: 'daily'
    target-branch: 'develop'
    cooldown:
      default-days: 7
