          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  oid:
                    type: string
                  message:
                    type: string
                  metadata:
                    type: object
                    nullable: true
                    properties: {}
                    additionalProperties:
                      nullable: true
                    description: Arbitrary object payload
                  details:
                    anyOf:
                      - type: string
                      - type: object
                        properties: {}
                        additionalProperties:
                          nullable: true
                        description: Arbitrary object payload
                  totalItems:
                    type: integer
                  items:
                    type: array
                    items:
                      type: object
                      properties: {}
                      additionalProperties:
                        nullable: true
                      description: Arbitrary object payload
                required:
                  - success
                  - oid
                  - message
                  - metadata
                  - totalItems
                  - items
                description: Storage service response envelope
          headers:
            Location:
              schema:
                type: string
                description: Location of the created record
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  details:
                    type: string
                required:
                  - message
                  - details
                description: Legacy API error response with message and details fields
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  details:
                    type: string
                required:
                  - message
                  - details
                description: Legacy API error response with message and details fields
      x-redbox-roles:
        - Admin
