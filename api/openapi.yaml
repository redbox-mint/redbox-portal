  /default/rdmp/api/records/harvest/{recordType}:
    post:
      tags:
        - Records
      summary: Harvest record metadata
      security:
        - bearerAuth: []
      parameters:
        - name: recordType
          in: path
          required: true
          schema:
            type: string
            description: Record type name
        - name: updateMode
          in: query
          required: false
          schema:
            type: string
            description: Harvest update mode
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties: {}
              additionalProperties: true
              description: Harvest payload
      responses:
        "200":
          description: Harvest results
          content:
            application/json:
              schema:
                anyOf:
                  - type: array
                    items:
                      type: object
                      properties:
                        harvestId:
                          type: string
                        oid:
                          type: string
                        message:
                          type: string
                        details:
                          type: string
                        status:
                          type: boolean
                      required:
                        - harvestId
                        - oid
                        - message
                        - details
                        - status
                      description: Legacy harvest response envelope
                  - type: object
                    properties:
                      run:
                        type: object
                        properties:
                          id:
                            type: string
                          sourceRunId:
                            type: string
                          brandId:
                            type: string
                          recordType:
                            type: string
                          sourceName:
                            type: string
                          sourceUri:
                            type: string
                          status:
                            type: string
                          startedAt:
                            type: string
                          completedAt:
                            type: string
                          startedBy:
                            type: string
                          lastChunkAt:
                            type: string
                          totalProcessed:
                            type: integer
                          created:
                            type: integer
                          updated:
                            type: integer
                          deleted:
                            type: integer
                          unchanged:
                            type: integer
                          failed:
                            type: integer
                          chunksProcessed:
                            type: integer
                          duplicateChunks:
                            type: integer
                        required:
                          - sourceRunId
                          - recordType
                          - sourceName
                          - status
                          - totalProcessed
                          - created
                          - updated
                          - deleted
                          - unchanged
                          - failed
                          - chunksProcessed
                          - duplicateChunks
                        description: Harvest run summary
                      chunk:
                        type: object
                        properties:
                          id:
                            type: string
                          runId:
                            type: string
                          brandId:
                            type: string
                          recordType:
                            type: string
                          sourceRunId:
                            type: string
                          contentHash:
                            type: string
                          attempt:
                            type: integer
                          chunkIndex:
                            type: integer
                          chunkLabel:
                            type: string
                          totalExpected:
                            type: integer
                          status:
                            type: string
                          recordCount:
                            type: integer
                          totalProcessed:
                            type: integer
                          created:
                            type: integer
                          updated:
                            type: integer
                          deleted:
                            type: integer
                          unchanged:
                            type: integer
                          failed:
                            type: integer
                          duplicate:
                            type: boolean
                          submittedAt:
                            type: string
                          completedAt:
                            type: string
                          errorMessage:
                            type: string
                        required:
                          - contentHash
                          - status
                          - recordCount
                          - totalProcessed
                          - created
                          - updated
                          - deleted
                          - unchanged
                          - failed
                          - duplicate
                        description: Harvest run chunk summary
                      records:
                        type: array
                        items:
                          type: object
                          properties:
                            harvestId:
                              type: string
                            oid:
                              type: string
                            operation:
                              type: string
                            outcome:
                              type: string
                            status:
                              type: boolean
                            message:
                              type: string
                            details:
                              type: string
                          required:
                            - harvestId
                            - oid
                            - operation
                            - outcome
                            - status
                            - message
                            - details
                          description: Tracked harvest record response row
                    required:
                      - run
                      - chunk
                    description: Tracked harvest chunk response envelope
                description: Harvest response for legacy and tracked payloads
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  details:
                    type: string
                required:
                  - message
                  - details
                description: Legacy API error response with message and details fields
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  details:
                    type: string
                required:
                  - message
                  - details
                description: Legacy API error response with message and details fields
      x-redbox-roles:
        - Admin
