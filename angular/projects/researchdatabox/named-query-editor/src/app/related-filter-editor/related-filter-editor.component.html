<div class="nq-subeditor">
  <div class="nq-section-header">
    <h2 class="nq-section-title">{{ 'named-query-related-filters-heading' | i18next }}</h2>
    <button class="btn btn-sm btn-outline-primary" type="button" (click)="addFilter()">
      {{ 'named-query-related-filter-add' | i18next }}
    </button>
  </div>
  <p class="rb-ws-lede">{{ 'named-query-related-filters-help' | i18next }}</p>

  <p *ngIf="filters.length === 0" class="rb-ws-empty">
    {{ 'named-query-related-filter-empty' | i18next }}
  </p>

  <div *ngFor="let filter of filters; let i = index; trackBy: trackById" class="card mb-2 nq-inline-card">
    <div class="card-header py-2 px-3 d-flex justify-content-between align-items-center">
      <div>
        <button type="button" class="btn btn-link p-0 nq-param-key" [attr.aria-expanded]="expandedId === filter.id" (click)="toggleExpand(filter)">
          {{ filter.collectionName || ('named-query-related-filter-unnamed' | i18next) }}
        </button>
        <span class="nq-chip ms-2" *ngIf="filter.localField || filter.foreignField">
          {{ filter.localField || '—' }} → {{ filter.foreignField || '—' }}
        </span>
      </div>
      <button
        class="btn btn-sm btn-outline-danger"
        type="button"
        (click)="removeFilter(filter); $event.stopPropagation()"
      >
        {{ 'named-query-remove' | i18next }}
      </button>
    </div>
    <nq-diagnostics [diagnostics]="diagnostics" [location]="'relatedRecordFilters.' + i"></nq-diagnostics>
    <div class="card-body" [hidden]="expandedId !== filter.id">
      <div *ngIf="filter.collectionName === 'record'" class="mb-2" data-nq-guidance>
        <label>{{ 'named-query-foreign-guidance' | i18next }}</label>
        <select
          class="form-select form-select-sm"
          [ngModel]="relatedGuidance[i]?.recordType || ''"
          (ngModelChange)="chooseForeign(i, $event)"
        >
          <option value="">{{ 'named-query-without-guidance' | i18next }}</option>
          <option *ngFor="let target of targets" [value]="target.id">{{ target.label }}</option>
        </select>
        <select
          *ngIf="relatedGuidance[i]"
          class="form-select form-select-sm"
          [ngModel]="relatedGuidance[i].stage || ''"
          (ngModelChange)="chooseForeign(i, relatedGuidance[i].recordType, $event)"
        >
          <option value="">{{ 'named-query-all-stages' | i18next }}</option>
          <ng-container *ngFor="let target of targets"
            ><ng-container *ngIf="target.id === relatedGuidance[i].recordType"
              ><option *ngFor="let stage of target.stages" [value]="stage.id">{{ stage.label }}</option></ng-container
            ></ng-container
          >
        </select>
      </div>
      <div class="row g-2">
        <div class="mb-2 col-md-4">
          <label>{{ 'named-query-related-filter-collection' | i18next }}</label>
          <input
            type="text"
            class="form-control form-control-sm"
            [ngModel]="filter.collectionName"
            (ngModelChange)="onFieldChange(filter, 'collectionName', $event)"
          />
        </div>
        <div class="mb-2 col-md-4">
          <label>{{ 'named-query-related-filter-local' | i18next }}</label>
          <nq-path-input
            [value]="filter.localField"
            [label]="'named-query-param-path' | i18next"
            [fields]="fields"
            (valueChange)="onFieldChange(filter, 'localField', $event)"
          ></nq-path-input>
        </div>
        <div class="mb-2 col-md-4">
          <label>{{ 'named-query-related-filter-foreign' | i18next }}</label>
          <nq-path-input
            [value]="filter.foreignField"
            [label]="'named-query-param-path' | i18next"
            [fields]="foreignFields[i] || []"
            (valueChange)="onFieldChange(filter, 'foreignField', $event)"
          ></nq-path-input>
        </div>
      </div>
      <p *ngIf="invalidFilters.has(filter.id)" class="text-danger small">{{ 'named-query-invalid-json' | i18next }}</p>
      <div class="row g-2">
        <div class="mb-2 col-12 mb-0">
          <label>{{ 'named-query-related-filter-mongo' | i18next }}</label>
          <textarea
            class="form-control form-control-sm nq-code-editor"
            rows="6"
            [ngModel]="filter.mongoQueryJson"
            (ngModelChange)="onMongoQueryJsonChange(filter, $event)"
            spellcheck="false"
          ></textarea>
        </div>
      </div>
    </div>
  </div>
</div>
