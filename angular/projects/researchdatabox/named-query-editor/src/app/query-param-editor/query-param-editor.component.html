<div class="nq-subeditor">
  <div class="nq-section-header">
    <h2 class="nq-section-title">{{ 'named-query-params-heading' | i18next }}</h2>
    <button *ngIf="!addingNew" class="btn btn-sm btn-outline-primary" type="button" (click)="startAdd()">
      {{ 'named-query-param-add' | i18next }}
    </button>
  </div>
  <p class="rb-ws-lede">{{ 'named-query-params-help' | i18next }}</p>

  <div *ngIf="addingNew" class="card mb-3 nq-inline-card">
    <div class="card-header py-2 px-3">
      <strong>{{ 'named-query-param-new' | i18next }}</strong>
    </div>
    <div class="card-body">
      <div class="row g-2">
        <div class="mb-2 col-md-6">
          <label [for]="inputId + '-key-' + 'new'">{{ 'named-query-param-key' | i18next }}</label>
          <input
            [id]="inputId + '-key-' + 'new'"
            type="text"
            class="form-control form-control-sm"
            [(ngModel)]="newParam.key"
            [attr.placeholder]="'named-query-param-key-placeholder' | i18next"
          />
        </div>
        <div class="mb-2 col-md-6">
          <label>{{ 'named-query-param-path' | i18next }}</label>
          <nq-path-input
            [value]="newParam.path"
            [label]="'named-query-param-path' | i18next"
            [fields]="fields"
            (valueChange)="newParam.path = $event"
          ></nq-path-input>
        </div>
      </div>
      <div class="row g-2">
        <div class="mb-2 col-md-4">
          <label [for]="inputId + '-type-' + 'new'">{{ 'named-query-param-type' | i18next }}</label>
          <select
            [id]="inputId + '-type-' + 'new'"
            class="form-select form-select-sm"
            [(ngModel)]="newParam.type"
            (ngModelChange)="defaultValidity(0, true)"
          >
            <option *ngFor="let t of typeOptions" [value]="t">{{ t }}</option>
          </select>
        </div>
        <div class="mb-2 col-md-4">
          <label [for]="inputId + '-query-type-' + 'new'">{{ 'named-query-param-query-type' | i18next }}</label>
          <select
            [id]="inputId + '-query-type-' + 'new'" class="form-select form-select-sm" [(ngModel)]="newParam.queryType">
            <option *ngFor="let qt of queryTypeOptions" [value]="qt">{{ qt || '(none)' }}</option>
          </select>
        </div>
        <div class="mb-2 col-md-4" *ngIf="newParam.type === 'date'">
          <label [for]="inputId + '-format-' + 'new'">{{ 'named-query-param-format' | i18next }}</label>
          <select
            [id]="inputId + '-format-' + 'new'" class="form-select form-select-sm" [(ngModel)]="newParam.format">
            <option *ngFor="let f of dateFormatOptions" [value]="f">{{ f }}</option>
          </select>
        </div>
      </div>
      <div class="row g-2">
        <div class="mb-2" [ngClass]="newParam.whenUndefined === 'defaultValue' ? 'col-md-6' : 'col-12'">
          <label [for]="inputId + '-when-undefined-' + 'new'">{{ 'named-query-param-when-undefined' | i18next }}</label>
          <select
            [id]="inputId + '-when-undefined-' + 'new'"
            class="form-select form-select-sm"
            [(ngModel)]="newParam.whenUndefined"
            (ngModelChange)="defaultValidity(0, true)"
          >
            <option *ngFor="let wu of whenUndefinedOptions" [value]="wu">{{ wu }}</option>
          </select>
        </div>
        <div class="mb-2 col-md-6" *ngIf="newParam.whenUndefined === 'defaultValue'">
          <label>{{ 'named-query-param-default' | i18next }}</label>
          <nq-typed-value
            [label]="('named-query-param-default' | i18next) + ': ' + newParam.key"
            unsetLabel="named-query-unset-default"
            [value]="newParam.defaultValue"
            [type]="newParam.type"
            [format]="newParam.format"
            [queryType]="newParam.queryType"
            [template]="newParam.template"
            (valueChange)="newParam.defaultValue = $event"
            (validityChange)="defaultValidity(0, $event)"
          ></nq-typed-value>
        </div>
      </div>
      <div class="row g-2">
        <div class="mb-2 col-12">
          <label [for]="inputId + '-template-new'">{{ 'named-query-param-template' | i18next }}: {{ newParam.key }}</label>
          <textarea
            [id]="inputId + '-template-new'"
            class="form-control form-control-sm font-monospace"
            rows="2"
            [(ngModel)]="newParam.template"
            (ngModelChange)="defaultValidity(0, true)"
            [attr.placeholder]="'named-query-param-template-placeholder' | i18next"
            spellcheck="false"
          ></textarea>
        </div>
      </div>
      <div class="nq-inline-actions">
        <button class="btn btn-sm btn-primary" type="button" (click)="addParam()">
          {{ 'named-query-add' | i18next }}
        </button>
        <button class="btn btn-sm btn-outline-secondary" type="button" (click)="cancelAdd()">
          {{ 'named-query-cancel' | i18next }}
        </button>
      </div>
    </div>
  </div>

  <p *ngIf="entries.length === 0 && !addingNew" class="rb-ws-empty">
    {{ 'named-query-param-empty' | i18next }}
  </p>

  <div *ngFor="let param of entries; trackBy: trackById" class="card mb-2 nq-inline-card">
    <div class="card-header py-2 px-3 d-flex justify-content-between align-items-center">
      <div class="nq-param-summary">
        <button type="button" class="btn btn-link p-0 nq-param-key" [attr.aria-expanded]="expandedParam === param.key" (click)="toggleExpand(param.key)">{{ param.key }}</button>
        <span class="nq-param-meta">
          <span>{{ param.type }}</span>
          <span *ngIf="param.path"> · {{ param.path }}</span>
          <span *ngIf="param.queryType"> · {{ param.queryType }}</span>
        </span>
      </div>
      <button
        class="btn btn-sm btn-outline-danger"
        type="button"
        (click)="removeParam(param); $event.stopPropagation()"
      >
        {{ 'named-query-remove' | i18next }}
      </button>
    </div>
    <nq-diagnostics [diagnostics]="diagnostics" [location]="'queryParams.' + param.key"></nq-diagnostics>
    <div class="card-body" [hidden]="expandedParam !== param.key">
      <div class="row g-2">
        <div class="mb-2 col-12">
          <label>{{ 'named-query-param-path' | i18next }}</label>
          <nq-path-input
            [value]="param.path"
            [label]="'named-query-param-path' | i18next"
            [fields]="fields"
            (valueChange)="onFieldChange(param, 'path', $event)"
          ></nq-path-input>
        </div>
      </div>
      <div class="row g-2">
        <div class="mb-2 col-md-4">
          <label [for]="inputId + '-type-' + param.id">{{ 'named-query-param-type' | i18next }}</label>
          <select
            [id]="inputId + '-type-' + param.id"
            class="form-select form-select-sm"
            [ngModel]="param.type"
            (ngModelChange)="onFieldChange(param, 'type', $event)"
          >
            <option *ngFor="let t of typeOptions" [value]="t">{{ t }}</option>
          </select>
        </div>
        <div class="mb-2 col-md-4">
          <label [for]="inputId + '-query-type-' + param.id">{{ 'named-query-param-query-type' | i18next }}</label>
          <select
            [id]="inputId + '-query-type-' + param.id"
            class="form-select form-select-sm"
            [ngModel]="param.queryType"
            (ngModelChange)="onFieldChange(param, 'queryType', $event)"
          >
            <option *ngFor="let qt of queryTypeOptions" [value]="qt">{{ qt || '(none)' }}</option>
          </select>
        </div>
        <div class="mb-2 col-md-4" *ngIf="param.type === 'date'">
          <label [for]="inputId + '-format-' + param.id">{{ 'named-query-param-format' | i18next }}</label>
          <select
            [id]="inputId + '-format-' + param.id"
            class="form-select form-select-sm"
            [ngModel]="param.format"
            (ngModelChange)="onFieldChange(param, 'format', $event)"
          >
            <option *ngFor="let f of dateFormatOptions" [value]="f">{{ f }}</option>
          </select>
        </div>
      </div>
      <div class="row g-2">
        <div class="mb-2" [ngClass]="param.whenUndefined === 'defaultValue' ? 'col-md-6' : 'col-12'">
          <label [for]="inputId + '-when-undefined-' + param.id">{{ 'named-query-param-when-undefined' | i18next }}</label>
          <select
            [id]="inputId + '-when-undefined-' + param.id"
            class="form-select form-select-sm"
            [ngModel]="param.whenUndefined"
            (ngModelChange)="onFieldChange(param, 'whenUndefined', $event)"
          >
            <option *ngFor="let wu of whenUndefinedOptions" [value]="wu">{{ wu }}</option>
          </select>
        </div>
        <div class="mb-2 col-md-6" *ngIf="param.whenUndefined === 'defaultValue'">
          <label>{{ 'named-query-param-default' | i18next }}</label>
          <nq-typed-value
            [label]="('named-query-param-default' | i18next) + ': ' + param.key"
            unsetLabel="named-query-unset-default"
            [value]="param.defaultValue"
            [type]="param.type"
            [format]="param.format"
            [queryType]="param.queryType"
            [template]="param.template"
            (valueChange)="onFieldChange(param, 'defaultValue', $event)"
            (validityChange)="defaultValidity(param.id, $event)"
          ></nq-typed-value>
        </div>
      </div>
      <div class="row g-2">
        <div class="mb-2 col-12 mb-0">
          <label [for]="inputId + '-template-' + param.id">{{ 'named-query-param-template' | i18next }}: {{ param.key }}</label>
          <textarea
            [id]="inputId + '-template-' + param.id"
            class="form-control form-control-sm font-monospace"
            rows="2"
            [ngModel]="param.template"
            (ngModelChange)="onFieldChange(param, 'template', $event)"
            [attr.placeholder]="'named-query-param-template-placeholder' | i18next"
            spellcheck="false"
          ></textarea>
        </div>
      </div>
    </div>
  </div>
</div>
