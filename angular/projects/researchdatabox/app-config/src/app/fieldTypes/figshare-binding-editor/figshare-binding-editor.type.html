<div class="card card-body mb-3">
  <div class="mb-3">
    <label class="form-label" [for]="idPrefix + '-kind'">{{ 'admin-config-binding-kind' | i18next }}</label>
    <select [id]="idPrefix + '-kind'" class="form-select" (change)="updateField('kind', $any($event.target).value)">
      @for (bindingKind of bindingKinds; track bindingKind) {
      <option [value]="bindingKind" [selected]="bindingKind === kind">{{ ('admin-config-enum-' + bindingKind) | i18next }}</option>
      }
    </select>
  </div>

  @if (kind === 'path') {
  <div class="mb-3">
    <label class="form-label" [for]="idPrefix + '-path'">{{ 'admin-config-binding-path' | i18next }}</label>
    <input [id]="idPrefix + '-path'"
      class="form-control"
      type="text"
      [value]="value.path || ''"
      (input)="updateField('path', $any($event.target).value)"
    />
  </div>
  } @if (kind === 'handlebars') {
  <div class="mb-3">
    <label class="form-label" [for]="idPrefix + '-template'">{{ 'admin-config-binding-template' | i18next }}</label>
    <textarea [id]="idPrefix + '-template'"
      class="form-control"
      rows="3"
      [value]="value.template || ''"
      (input)="updateField('template', $any($event.target).value)"
    ></textarea>
  </div>
  } @if (kind === 'jsonata') {
  <div class="mb-3">
    <label class="form-label" [for]="idPrefix + '-expression'">{{ 'admin-config-binding-expression' | i18next }}</label>
    <textarea [id]="idPrefix + '-expression'"
      class="form-control"
      rows="3"
      [value]="value.expression || ''"
      (input)="updateField('expression', $any($event.target).value)"
    ></textarea>
  </div>
  }

  <div>
    <label class="form-label" [for]="idPrefix + '-defaultValue'">{{ 'admin-config-binding-default-value' | i18next }}</label>
    <input [id]="idPrefix + '-defaultValue'"
      class="form-control"
      type="text"
      [value]="value.defaultValue || ''"
      (input)="updateField('defaultValue', $any($event.target).value)"
    />
  </div>
</div>
