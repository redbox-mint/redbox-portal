<div class="rb-form-shell">
  <redbox-form-conflict-presenter
    [conflict]="conflictState()"
    [review]="conflictReview()"
    [resolving]="manualConflictResolutionPending()"
    (reviewRequested)="reviewConflictChanges()"
    (discardRequested)="discardConflictChanges()"
    (resolutionRequested)="submitManualConflictResolution($event)"
  ></redbox-form-conflict-presenter>

  <div class="rb-form-shell__main" [class.rb-form-shell__main--loading]="!componentsLoaded()">
    @if (!componentsLoaded()) {
      <div class="rb-form-loading">
        <img
          class="center-block rb-form-loading__spinner"
          src="/images/loading.svg"
          [attr.alt]="'loading-alt-text' | i18next"
        />
      </div>
    }
    <div class="rb-form-components" [attr.aria-hidden]="!componentsLoaded() ? 'true' : null">
      <ng-container #componentsContainer></ng-container>
    </div>
  </div>

  @if (componentDefArr.length > 0 && debugState.isDebugEnabled()) {
    <redbox-form-debug-panel></redbox-form-debug-panel>
  }

  <redbox-confirmation-dialog></redbox-confirmation-dialog>

  <record-audit-launcher
    [oid]="trimmedParams.oid()"
    [branding]="trimmedParams.branding()"
    [portal]="trimmedParams.portal()"
    [allowedRoles]="viewAuditRoles()"
  />
</div>
