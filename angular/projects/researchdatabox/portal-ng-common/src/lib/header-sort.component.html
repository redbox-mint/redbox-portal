<button type="button" (click)="headerSortClicked()" class="record-table-heading-sort">
  {{title}}
  @if (sort == 'asc') {
    <span class="record-table-heading-sort-icon">
      <i class="fa fa-sort-asc" aria-hidden="true"></i>
    </span>
    }@if (sort == 'desc') {
    <span class="record-table-heading-sort-icon">
      <i class="fa fa-sort-desc" aria-hidden="true"></i>
    </span>
    }@if (!['asc', 'desc'].includes(sort)) {
    <span class="record-table-heading-sort-icon"><i class="fa fa-sort" aria-hidden="true"></i></span>
  }
</button>
