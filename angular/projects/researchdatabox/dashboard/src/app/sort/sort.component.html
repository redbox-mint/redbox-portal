@if (adminPresentation) {
<button type="button" class="rb-admin-sort" (click)="sortClicked()">
  {{ title }}
  @if (sort == 'asc') {
    <i class="fa fa-sort-asc" aria-hidden="true"></i>
  }
  @if (sort !== 'asc' && sort !== 'desc') {<i class="fa fa-sort" aria-hidden="true"></i>}
  @if (sort == 'desc') {
    <i class="fa fa-sort-desc" aria-hidden="true"></i>
  }
</button>
} @else {
<a href="#" role="button" (click)="sortClicked()">
  {{ title }}
  @if (sort == 'asc') {
    <i class="fa fa-sort-asc" aria-hidden="true"></i>
  }
  @if (sort !== 'asc' && sort !== 'desc') {<i class="fa fa-sort" aria-hidden="true"></i>}
  @if (sort == 'desc') {
    <i class="fa fa-sort-desc" aria-hidden="true"></i>
  }
</a>
}
