  test-bruno-general:
    machine:
      image: ubuntu-2404:current
    resource_class: large
    environment:
      RBPORTAL_IMAGE: redbox-portal:test
    steps:
      - checkout
      - run: &selectPatchedNode
          name: Select patched Node.js from .nvmrc
          command: |
            nvm install
            nvm use
            printf 'export PATH="%s:$PATH"\n' "$(dirname "$(command -v node)")" >> "$BASH_ENV"
      - attach_workspace:
          at: /tmp
      - run:
          name: Load Docker image
          command: docker load -i /tmp/docker-images/redbox-portal-test.tar
      - run:
          name: Point compose at tested image
          command: echo 'export RBPORTAL_IMAGE=redbox-portal:test' >> "$BASH_ENV"
      - restore_cache:
          keys:
            - v1-npm-cache-{{ arch }}-{{ .Branch }}-{{ checksum "package-lock.json" }}
            - v1-npm-cache-{{ arch }}-{{ .Branch }}
            - v1-npm-cache-
      - run:
          name: Install npm dependencies
          command: |
            npm install --global npm@11.20.0 --ignore-scripts --no-audit
            npm ci --ignore-scripts --strict-peer-deps
      - run: &installCodecov # https://docs.codecov.com/docs/codecov-uploader#integrity-checking-the-codecov-cli
          name: Install codecov
          command: |
            mkdir -p /tmp/.codecov-cli
            cd /tmp/.codecov-cli
            downloadCodecovFile() {
              local url="$1"
              local target="$2"
              local attempt
              for attempt in 1 2 3 4 5; do
                if curl --fail --location --silent --show-error --retry 2 --retry-delay 3 --retry-all-errors --output "$target" "$url" && test -s "$target"; then
                  return 0
                fi
                echo "Retrying Codecov download ($attempt/5): $url" >&2
                sleep 3
              done
              return 1
            }
            downloadCodecovFile https://keybase.io/codecovsecops/pgp_keys.asc pgp_keys.asc
            gpg --no-default-keyring --keyring trustedkeys.gpg --import pgp_keys.asc
            downloadCodecovFile https://cli.codecov.io/latest/linux/codecov codecov
            downloadCodecovFile https://cli.codecov.io/latest/linux/codecov.SHA256SUM codecov.SHA256SUM
            downloadCodecovFile https://cli.codecov.io/latest/linux/codecov.SHA256SUM.sig codecov.SHA256SUM.sig
            gpgv codecov.SHA256SUM.sig codecov.SHA256SUM
            shasum -a 256 -c codecov.SHA256SUM
            chmod +x codecov
            /tmp/.codecov-cli/codecov --help
      - run:
          name: Setup test directories
          command: |
            sudo mkdir -p .tmp/junit/backend-bruno
            sudo mkdir -p .tmp/attachments/staging
            sudo chmod -R 777 .
      - run:
          name: Run Bruno General tests
          no_output_timeout: 30m
          command: BRUNO_POST_SLEEP_SECONDS=180 timeout 1800s npm run test:bruno:general:ci
      - run:
          name: Clean up Bruno containers
          command: npm run test:bruno:clean || true
          when: always
      - run:
          name: Upload Bruno General code coverage
          command: |
            sudo chmod -R a+rwX ./coverage
            node support/unit-testing/codecov/prepare-report.cjs "./coverage/bruno-general/lcov.info"
            /tmp/.codecov-cli/codecov --verbose upload-process --fail-on-error --disable-search \
             --network-root-folder "$(git rev-parse --show-toplevel)" \
             --token "${CODECOV_TOKEN}" --name "job-${CIRCLE_BUILD_NUM}-${CIRCLE_TAG:-$CIRCLE_BRANCH}" \
             --flag "backend-bruno-general" --file "./coverage/bruno-general/lcov.info" --branch "${CIRCLE_TAG:-$CIRCLE_BRANCH}"
          when: always
      - store_test_results:
          path: .tmp/junit
      - save_cache:
          key: v1-npm-cache-{{ arch }}-{{ .Branch }}-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm
