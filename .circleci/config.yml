    machine:
      image: ubuntu-2404:current
    resource_class: medium
    steps:
      - checkout
      - run:
          <<: *selectPatchedNode
      - run:
          <<: *installCodecov
      - run:
          name: Install root dependencies
          command: |
            nvm install
            npm install --global npm@11.20.0 --ignore-scripts --no-audit
            npm ci --ignore-scripts --strict-peer-deps
