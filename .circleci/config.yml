jobs:
  build:
    docker:
      - image: 'cimg/node:26.12.1@sha256:8b451a3ecf9eb810f23612be560c17731d2766f0ad104fff9f5ae7d26d3f061a'
    resource_class: large
    steps:
      - checkout
      - restore_cache:
          keys:
            - v1-npm-cache-{{ arch }}-{{ .Branch }}-{{ checksum "package-lock.json" }}
            - v1-npm-cache-{{ arch }}-{{ .Branch }}
            - v1-npm-cache-
      - run:
          name: Install npm dependencies
          command: |
            sudo npm install --global npm@11.20.0 --ignore-scripts --no-audit
            npm ci --ignore-scripts --strict-peer-deps
      - run:
          name: Verify committed Prisma contracts before compilation
          command: npm run check:prisma
      - run:
          name: Run lint
          command: npm run lint
      - run:
          name: Test npm publish version handling
          command: bash support/build/npm-publish-backend-packages.test.sh
      - run:
          name: Test Docker tag handling
          command: bash support/build/docker-build-vars.test.sh
      - run:
          name: Verify release image audits block publication
          command: bash support/build/docker-publish-closure.test.sh
      - run:
          name: Test Angular bundle stats accounting
          command: node --test support/build/angular-bundle-stats.test.cjs
      - save_cache:
          key: v1-npm-cache-{{ arch }}-{{ .Branch }}-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm
      - setup_remote_docker
      - run:
          name: Build test image via Dockerfile
          no_output_timeout: 30m
          command: |
            docker build \
              --progress plain \
              --target test \
              --tag redbox-portal:test \
              .
      - run:
          name: Audit every built server tarball for Express closure
          command: |
            timeout 600s docker run --rm --network none --entrypoint node redbox-portal:test \
              support/tooling/fastify-retirement/express-closure.cjs --pack
      - run:
          name: Audit the actual production runtime filesystem for Express closure
          no_output_timeout: 30m
          command: |
            timeout 1800s docker build --progress plain --target runtime --tag redbox-portal:runtime .
            timeout 1200s node support/tooling/fastify-retirement/runtime-image-audit.cjs redbox-portal:runtime --negative-control
      - run:
          name: Verify PDF hook unit tests in the built test image
          command: |
            docker run --rm --entrypoint bash redbox-portal:test -lc \
              'cd /opt/redbox-portal/packages/sails-hook-redbox-pdfgen && npm run test:unit'
      - run:
          name: Save Docker image
          command: |
            mkdir -p /tmp/docker-images
            docker save -o /tmp/docker-images/redbox-portal-test.tar redbox-portal:test
            docker save -o /tmp/docker-images/redbox-portal-runtime.tar redbox-portal:runtime
      - persist_to_workspace:
          root: /tmp
          paths:
            - docker-images/redbox-portal-test.tar
            - docker-images/redbox-portal-runtime.tar
  generate-api-docs:
    docker:
      - image: 'cimg/node:26.12.1@sha256:8b451a3ecf9eb810f23612be560c17731d2766f0ad104fff9f5ae7d26d3f061a'
    resource_class: large
    steps:
      - checkout
      - restore_cache:
          keys:
            - v1-npm-cache-{{ arch }}-{{ .Branch }}-{{ checksum "package-lock.json" }}
            - v1-npm-cache-{{ arch }}-{{ .Branch }}
            - v1-npm-cache-
      - run:
          name: Install npm dependencies
          command: |
            sudo npm install --global npm@11.20.0 --ignore-scripts --no-audit
            npm ci --ignore-scripts --strict-peer-deps
            npm --prefix angular ci --ignore-scripts --strict-peer-deps
      - run:
          name: Build redbox-core assets
          command: |
            npm run compile:raido
            npm run compile:rva
            npm run compile:sails-ng-common
            npm run compile:agenda-sqs
            npm run compile:core
      - run:
          name: Validate API route contracts
          command: npm run validate:api-routes
      - run:
          name: Generate API docs artifacts
          command: npm run doc:api
      - run:
          name: Test and audit generated contract documentation
          command: |
            npm run docs:generate
            npm run docs:check
            npm run docs:test
            npm run docs:audit
      - store_artifacts:
          path: support/docs/generated/api
          destination: api-docs
      - store_artifacts:
          path: .tmp/documentation-health
          destination: documentation-health
      - run:
          name: Enforce first-party Express retirement
          command: |
            # The compile steps install package-local development trees, and the
            # route/docs steps above use them. Root npm ci does not replace them,
            # so remove them before restoring the application lock layout;
            # otherwise npm ls reports Companion's root dependencies as extraneous.
            rm -rf packages/*/node_modules
            timeout 600s npm ci --ignore-scripts --strict-peer-deps --no-audit
            timeout 300s npm run test:express-closure
      - save_cache:
          key: v1-npm-cache-{{ arch }}-{{ .Branch }}-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm
  refresh-dependabot-package-locks:
    docker:
      - image: 'cimg/node:26.12.1@sha256:8b451a3ecf9eb810f23612be560c17731d2766f0ad104fff9f5ae7d26d3f061a'
    steps:
      - add_ssh_keys:
          fingerprints:
            - '50:0c:a1:7f:b6:64:84:42:01:61:0f:76:3f:e4:78:ff'
      - checkout
      - run:
          name: Refresh package locks
          command: |
            sudo npm install --global npm@11.20.0 --ignore-scripts --no-audit
            git fetch origin "$CIRCLE_BRANCH"
            git checkout -B "$CIRCLE_BRANCH" "origin/$CIRCLE_BRANCH"

            ./support/development/refreshRootPackageLock.sh \
              . \
              packages/agenda-sqs-backend \
              packages/redbox-core \
              packages/redbox-dev-tools \
              packages/sails-hook-redbox-pdfgen \
              packages/sails-ng-common \
              packages/sails-hook-redbox-storage-mongo
      - run:
          name: Commit refreshed package locks
          command: |
            git config user.name 'ci-build'
            git config user.email 'ci-build@redboxresearchdata.com.au'

            git add package-lock.json packages/*/package-lock.json

            if git diff --cached --quiet; then
              echo 'Package locks are already up to date.'
              exit 0
            fi

            git commit -m 'Build(deps): refresh package locks'
            git push origin "HEAD:${CIRCLE_BRANCH}"
  build-runtime-pdfgen:
    docker:
      - image: 'cimg/node:26.12.1@sha256:8b451a3ecf9eb810f23612be560c17731d2766f0ad104fff9f5ae7d26d3f061a'
