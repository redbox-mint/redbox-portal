version: 2.1
jobs:
  registry-quota:
    docker:
      - image: cimg/node:24.22.1
    resource_class: small
    steps:
      - run:
          name: Wait for authenticated Docker Hub pull allowance (no image pulls)
          no_output_timeout: 5m
          command: |
            node \<<'NODE'
            (async () => {
              for (let attempt = 1; attempt <= 65; attempt++) {
                const authorization = 'Basic ' + Buffer.from(process.env.DOCKER_USER + ':' + process.env.DOCKER_PASS).toString('base64');
                const response = await fetch('https://auth.docker.io/token?service=registry.docker.io&scope=repository:library/node:pull', {headers: {authorization}});
                const data = await response.json();
                const token = data.token || data.access_token;
                if (!token) throw new Error('Cannot inspect registry quota: token request status ' + response.status);
                const manifest = await fetch('https://registry-1.docker.io/v2/library/node/manifests/latest', {method: 'HEAD', headers: {authorization: 'Bearer ' + token, accept: 'application/vnd.docker.distribution.manifest.list.v2+json'}});
                const remaining = manifest.headers.get('ratelimit-remaining');
                console.log(new Date().toISOString(), 'attempt', attempt, 'status', manifest.status, 'quota', manifest.headers.get('ratelimit-limit'), 'remaining', remaining);
                if (manifest.ok && remaining && Number.parseInt(remaining) >= 100) return;
                if (attempt < 65) await new Promise(resolve => setTimeout(resolve, 60000));
              }
              throw new Error('Docker Hub allowance remains exhausted after quota observation');
            })().catch(error => { console.error(error.message); process.exit(1); });
            NODE
workflows:
  observe_registry_quota:
    jobs:
      - registry-quota:
          filters:
            branches:
              only: chore/ci-build-speed
