      - run:
          name: Create and push multi-arch pdfgen manifest
          command: chmod +x support/build/docker-publish-manifest.sh && support/build/docker-publish-manifest.sh "-pdfgen"
  generate-docs:
    machine:
      image: ubuntu-2404:current
    steps:
      - add_ssh_keys:
          fingerprints:
            - '50:0c:a1:7f:b6:64:84:42:01:61:0f:76:3f:e4:78:ff'
      - checkout
      - run:
          <<: *selectPatchedNode
      - restore_cache:
          keys:
            - v1-npm-cache-{{ arch }}-{{ .Branch }}-{{ checksum "package-lock.json" }}
            - v1-npm-cache-{{ arch }}-{{ .Branch }}
            - v1-npm-cache-
      - run:
          name: Install npm dependencies
          command: |
            npm install --global npm@11.20.0 --ignore-scripts --no-audit
            npm ci --ignore-scripts --strict-peer-deps
            npm --prefix angular ci --ignore-scripts --strict-peer-deps
      - run:
          name: Build redbox-core assets
          command: |
            npm run compile:raido
            npm run compile:rva
            npm run compile:sails-ng-common
            npm run compile:agenda-sqs
            npm run compile:core
      - run:
          name: Generate extension, form, and REST references
          command: |
            npm run doc:api -- --branding=default --portal=rdmp
            npm run docs:generate
            DOCS_API_BRANDING=default DOCS_API_PORTAL=rdmp npm run docs:check
            DOCS_API_BRANDING=default DOCS_API_PORTAL=rdmp npm run docs:test
      - run:
          name: Deploy generated references to gh-pages
          command: |
            git config user.email "ci-build@redboxresearchdata.com.au"
            git config user.name "ci-build"
            ./node_modules/.bin/gh-pages --dotfiles --message "[ci skip] Updating generated documentation" --dist .tmp/generated-docs-site
      - store_artifacts:
          path: .tmp/documentation-health
          destination: documentation-health
      - save_cache:
          key: v1-npm-cache-{{ arch }}-{{ .Branch }}-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm
  publish-wiki:
    docker:
      - image: 'cimg/node:26.12.1@sha256:8b451a3ecf9eb810f23612be560c17731d2766f0ad104fff9f5ae7d26d3f061a'
    steps:
      - add_ssh_keys:
          fingerprints:
            - '50:0c:a1:7f:b6:64:84:42:01:61:0f:76:3f:e4:78:ff'
      - checkout
      - run:
          name: Publish wiki docs
          command: |
            git config --global user.email "ci-build@redboxresearchdata.com.au"
            git config --global user.name "ci-build"

            wiki_dir=$(mktemp -d)
            git clone git@github.com:redbox-mint/redbox-portal.wiki.git "$wiki_dir"
            git -C "$wiki_dir" rm -r --ignore-unmatch .
            cp -a support/wiki/. "$wiki_dir"/
            git -C "$wiki_dir" add -A

            if git -C "$wiki_dir" diff --cached --quiet; then
              echo "Wiki is already up to date."
              exit 0
            fi

            git -C "$wiki_dir" commit -m "[ci skip] Update wiki docs from ${CIRCLE_SHA1}"
            git -C "$wiki_dir" push origin HEAD
