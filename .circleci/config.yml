  test-sails-ng-common:
    machine:
      image: ubuntu-2404:current
    resource_class: large
    steps:
      - checkout
      - run:
          <<: *selectPatchedNode
      - attach_workspace:
          at: /tmp
      - run:
          <<: *installCodecov
      - run:
          name: Install packages
          command: |
            nvm install
            nvm use
            npm install --global npm@11.20.0 --ignore-scripts --no-audit
            npm ci --ignore-scripts --strict-peer-deps
            cd ./packages/sails-ng-common
            npm ci --include=dev
      - run:
          name: Run Mocha tests
          no_output_timeout: 30m
          command: |
            cd ./packages/sails-ng-common
            npm run test:compile
            npm run test:prepare
            npx nyc --no-clean --report-dir ./coverage/sails-ng-common --reporter=lcov --exclude-after-remap=false \
              npx mocha --config test/unit/.mocharc.js --exit dist/test/unit/**/*.test.js
            npm run test:browser
      - run:
          name: Upload Mocha code coverage
          command: |
            cd ./packages/sails-ng-common
            node ../../support/unit-testing/codecov/prepare-report.cjs \
              "./coverage/sails-ng-common/lcov.info" "packages/sails-ng-common"
            /tmp/.codecov-cli/codecov --verbose upload-process --fail-on-error --disable-search \
             --network-root-folder "$(git rev-parse --show-toplevel)" \
             --token "${CODECOV_TOKEN}" --name "job-${CIRCLE_BUILD_NUM}-${CIRCLE_TAG:-$CIRCLE_BRANCH}" \
             --flag "backend-sails-ng-common" --file "./coverage/sails-ng-common/lcov.info" --branch "${CIRCLE_TAG:-$CIRCLE_BRANCH}"
          when: always
      - store_test_results:
          path: packages/sails-ng-common/support/junit
  test-redbox-core:
    machine:
      image: ubuntu-2404:current
    resource_class: large
    environment:
      FIGSHARE_TEST_MONGO_URI: mongodb://127.0.0.1:27028
      SIEM_TEST_MONGO_URL: mongodb://127.0.0.1:27028
      HTTP_PILOT_TEST_MONGO_URL: mongodb://127.0.0.1:27028/sr_p4_http
      HTTP_READ_SOLR_PORT: "28983"
    steps:
      - checkout
      - run:
          <<: *selectPatchedNode
      - attach_workspace:
          at: /tmp
      - run:
          name: Start MongoDB for Figshare worker tests
          command: |
            # The core suite creates many disposable databases; WiredTiger aborts
            # with "Too many open files" under a 1024 descriptor limit.
            docker run -d --name figshare-test-mongo --ulimit nofile=64000:64000 -p 127.0.0.1:27028:27017 mongo:9.0.4@sha256:dc28ed5a9d0fc616903c3f463bb1e53b92b49f441721b91926e87d90bf957ce8
            for attempt in $(seq 1 30); do
              if docker exec figshare-test-mongo mongosh --quiet --eval 'quit(db.adminCommand({ ping: 1 }).ok ? 0 : 1)'; then
                exit 0
              fi
              sleep 2
            done
            exit 1
      - run:
          name: Start Solr for the production Fastify contract suites
          command: |
            docker run -d --name core-test-solr -p 127.0.0.1:28983:8983 -e SOLR_HEAP=512m \
              solr@sha256:b866a82ef3a0a16ed25005731dd0c5d87541b70783a14a2392ecfa12810541cb solr-precreate redbox
            timeout 90s bash -c 'until curl -fsS http://127.0.0.1:28983/solr/redbox/admin/ping; do sleep 1; done'
      - run:
          <<: *installCodecov
      - run:
          name: Install required ReDBox dependencies
          command: |
            nvm install
            npm install --global npm@11.20.0 --ignore-scripts --no-audit
            npm ci --ignore-scripts --strict-peer-deps && npm run compile:sails-ng-common && npm run compile:raido && npm run compile:rva && npm run compile:agenda-sqs
      - run:
          name: Install packages
          command: |
            nvm install
            cd ./packages/redbox-core
            npm ci --include=dev --ignore-scripts --strict-peer-deps
            npm run check:prisma
            # Migration tests load api/migrations, which require the built package entry point.
            npm run build
      - run:
          name: Build bundled storage and development hooks
          command: |
            # Production-host and bundled-extension suites load these packages' dist output.
            nvm install
            npm run compile:dev-tools
            npm run compile:storage-mongo
            npm run compile:dev-hook
            npm run compile:pdfgen-hook
      - run:
          name: Type-check Effect integrations and tests
          command: nvm install && npm --prefix packages/redbox-core run typecheck:effect
      - run:
          name: Verify record-contract coverage
          command: nvm install && npm run test:record-contracts
      - run:
          name: Run Mocha tests with coverage
          no_output_timeout: 30m
          command: |
            cd ./packages/redbox-core
            mkdir -p support/junit .tmp
            export FM043_AUTHORIZATION_REPORT="$PWD/.tmp/authorization-passes.json"
            nvm install && timeout 5400s npx nyc --no-clean --report-dir ./coverage/redbox-core --reporter=lcov --exclude-after-remap=false \
              npx mocha --config .mocharc.js --reporter ../../support/tooling/fastify-retirement/authorization-reporter.cjs \
                --exit test/**/*.test.ts
      - run:
          name: Show test MongoDB state on failure
          when: on_fail
          command: |
            docker ps -a --filter name=figshare-test-mongo
            docker logs --tail 200 figshare-test-mongo 2>&1 | grep -E '"s":"(F|E|W)"' | tail -40 || true
      - run:
          name: Hand the core authorization report to the coverage audit
          command: |
            # check-authorization-coverage combines this report with the witness jobs' reports.
            mkdir -p /tmp/authorization-reports
            cp packages/redbox-core/.tmp/authorization-passes.json /tmp/authorization-reports/core.json
      - persist_to_workspace:
          root: /tmp
          paths:
            - authorization-reports/core.json
      - when:
          condition: << pipeline.parameters.authorization_guard_mutation >>
          steps:
            - run:
                name: Run the authorization guard mutation gate
                no_output_timeout: 20m
                command: |
                  nvm use
                  mkdir -p artifacts/authorization-mutation
                  FM043_DISPOSABLE_TEST_SERVICES=1 timeout --kill-after=30s 18000s \
                    node support/tooling/fastify-retirement/authorization-mutation.cjs \
                      --output artifacts/authorization-mutation/results.json
            - store_artifacts:
                path: artifacts/authorization-mutation
      - run:
          name: Verify Prisma persistence on isolated MongoDB
          no_output_timeout: 10m
          command: nvm install && npm --prefix packages/redbox-core run test:persistence
      - run:
          name: Upload redbox-core code coverage
          command: |
            cd ./packages/redbox-core
            node ../../support/unit-testing/codecov/prepare-report.cjs \
              "./coverage/redbox-core/lcov.info" "packages/redbox-core"
            /tmp/.codecov-cli/codecov --verbose upload-process --fail-on-error --disable-search \
             --network-root-folder "$(git rev-parse --show-toplevel)" \
             --token "${CODECOV_TOKEN}" --name "job-${CIRCLE_BUILD_NUM}-${CIRCLE_TAG:-$CIRCLE_BRANCH}" \
             --flag "backend-redbox-core" --file "./coverage/redbox-core/lcov.info" --branch "${CIRCLE_TAG:-$CIRCLE_BRANCH}"
          when: always
      - store_test_results:
          path: packages/redbox-core/support/junit
  test-redbox-core-authorization-witnesses:
    # Real-service authorization witnesses that the core Mocha config always skips.
    # They run in parallel with test-redbox-core; check-authorization-coverage
    # verifies that the groups below cover every witness the core run misses.
    parameters:
      group:
        type: string
    machine:
      image: ubuntu-2404:current
    resource_class: large
    environment:
      HTTP_PILOT_TEST_MONGO_URL: mongodb://127.0.0.1:27028/sr_p4_http
      HTTP_READ_SOLR_PORT: "28983"
      # Leave SIEM_TEST_MONGO_URL unset: the read differential's SIEM golden
      # contract needs the suite's own database.
    steps:
      - checkout
      - run:
          <<: *selectPatchedNode
      - run:
          name: Start MongoDB and Solr for the witness suites
          command: |
            docker run -d --name witness-test-mongo --ulimit nofile=64000:64000 -p 127.0.0.1:27028:27017 mongo:9.0.4@sha256:dc28ed5a9d0fc616903c3f463bb1e53b92b49f441721b91926e87d90bf957ce8
            docker run -d --name witness-test-solr -p 127.0.0.1:28983:8983 -e SOLR_HEAP=512m \
              solr@sha256:b866a82ef3a0a16ed25005731dd0c5d87541b70783a14a2392ecfa12810541cb solr-precreate redbox
            timeout 90s bash -c 'until docker exec witness-test-mongo mongosh --quiet --eval "quit(db.adminCommand({ ping: 1 }).ok ? 0 : 1)"; do sleep 2; done'
            timeout 90s bash -c 'until curl -fsS http://127.0.0.1:28983/solr/redbox/admin/ping; do sleep 1; done'
      - run:
          name: Install and build ReDBox packages
          command: |
            nvm install
            npm install --global npm@11.20.0 --ignore-scripts --no-audit
            npm ci --ignore-scripts --strict-peer-deps
            npm run compile:sails-ng-common && npm run compile:raido && npm run compile:rva && npm run compile:agenda-sqs
            (cd packages/redbox-core && npm ci --include=dev --ignore-scripts --strict-peer-deps && npm run build)
            npm run compile:dev-tools
            npm run compile:storage-mongo
            npm run compile:dev-hook
            npm run compile:pdfgen-hook
      - run:
          name: Run authorization witness suites (<< parameters.group >>)
          no_output_timeout: 30m
          command: |
            nvm use
            case "<< parameters.group >>" in
              # Balanced from local timings: about 18-20 minutes of suites per group.
              assets-identity)
                files=(AssetDifferentialMongo IdentityAdministrationDifferentialMongo ReferenceDifferentialMongo CompanionRetirementPolicyMongo) ;;
              integrations-datastreams)
                files=(IntegrationDifferentialMongo DatastreamDifferentialMongo UploadDifferentialMongo BrowserDifferentialMongo ProgressDifferentialMongo) ;;
              mutations-reads)
                files=(MutationDifferentialMongo MetadataDifferentialMongo ReadDifferentialMongo rawSocketMongo) ;;
              *) echo "Unknown witness group << parameters.group >>" >&2; exit 1 ;;
            esac
            mkdir -p /tmp/authorization-reports packages/redbox-core/support/junit
            cd packages/redbox-core
            export TS_NODE_PROJECT=test/tsconfig.json
            for name in "${files[@]}"; do
              # Each suite starts with an empty disposable Solr index; the search
              # contract asserts the exact records in its own fixture.
              curl -fsS --max-time 15 -H 'Content-Type: application/json' \
                --data '{"delete":{"query":"*:*"}}' 'http://127.0.0.1:28983/solr/redbox/update?commit=true'
              FM043_AUTHORIZATION_REPORT="/tmp/authorization-reports/$name.json" \
                timeout 2700s node --no-experimental-strip-types ../../node_modules/mocha/bin/mocha.js \
                  --no-config --require ts-node/register/transpile-only --require chai --require test/setup.ts \
                  --reporter ../../support/tooling/fastify-retirement/authorization-reporter.cjs \
                  --reporter-option "mochaFile=support/junit/authorization-$name.xml" --exit --timeout 120000 \
                  "test/http/fastify/$name.test.ts"
            done
      - persist_to_workspace:
          root: /tmp
          paths:
            - authorization-reports/*Mongo.json
      - store_test_results:
          path: packages/redbox-core/support/junit
  check-authorization-coverage:
    docker:
      - image: 'cimg/node:26.12.1@sha256:8b451a3ecf9eb810f23612be560c17731d2766f0ad104fff9f5ae7d26d3f061a'
    resource_class: medium
    steps:
      - checkout
      - restore_cache:
          keys:
            - v1-npm-cache-{{ arch }}-{{ .Branch }}-{{ checksum "package-lock.json" }}
            - v1-npm-cache-{{ arch }}-{{ .Branch }}
            - v1-npm-cache-
      - attach_workspace:
          at: /tmp
      - run:
          name: Install audit dependencies
          command: npm ci --ignore-scripts --strict-peer-deps --no-audit
      - run:
          name: Check production HTTP authorization decision coverage
          command: |
            audit=support/tooling/fastify-retirement/authorization-coverage.cjs
            core_report=/tmp/authorization-reports/core.json
            # Every witness file the core run misses must have come from a witness group.
            missing=0
            while read -r file; do
              [[ -z "$file" ]] && continue
              name="$(basename "$file" .test.ts)"
              if [[ ! -f "/tmp/authorization-reports/$name.json" ]]; then
                echo "No witness group ran $file; add it to test-redbox-core-authorization-witnesses." >&2
                missing=1
              fi
            done < <(timeout 300s node "$audit" --missing-test-files --mocha-report="$core_report")
            (( missing == 0 ))
            reports=()
            for report in /tmp/authorization-reports/*.json; do reports+=("--mocha-report=$report"); done
            timeout 300s node "$audit" "${reports[@]}"
