      - checkout
      - setup_remote_docker
      - attach_workspace:
          at: /tmp
      - run:
          name: Create and push multi-arch manifest
          command: chmod +x support/build/docker-publish-manifest.sh && support/build/docker-publish-manifest.sh
  publish-runtime-pdfgen-manifest:
    docker:
      - image: 'cimg/node:26.12.1@sha256:8b451a3ecf9eb810f23612be560c17731d2766f0ad104fff9f5ae7d26d3f061a'
