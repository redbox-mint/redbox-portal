      - run:
          name: Publish backend npm packages
          command: |
            source "$BASH_ENV"
            CIRCLE_PIPELINE_NUMBER="<< pipeline.number >>" \
            NPM_RELEASE_KIND="<< parameters.release_kind >>" \
            NPM_PUBLISH_VERSION="<< parameters.release_version >>" \
            NPM_DIST_TAG="<< parameters.dist_tag >>" \
            bash support/build/npm-publish-backend-packages.sh
  deploy:
    docker:
      - image: 'cimg/node:26.12.1@sha256:8b451a3ecf9eb810f23612be560c17731d2766f0ad104fff9f5ae7d26d3f061a'
    steps:
      - checkout
      - setup_remote_docker
      - attach_workspace:
          at: /tmp
      - run:
          name: Upload package to Nexus
          command: |
            echo $CIRCLE_BRANCH
            npm pack
            PACKAGE_VERSION=$(cat package.json \
            | grep version \
            | head -1 \
            | awk -F: '{ print $2 }' \
            | sed 's/[", \t]//g')
            RBPORTAL_FILENAME=$(ls redbox-portal-*.tgz)
            curl -v -u $MAVEN_USER:$MAVEN_PASSWORD --upload-file $RBPORTAL_FILENAME "https://nexus-prod.redboxresearchdata.com.au/nexus/repository/maven-snapshots/au/edu/qcif/redbox-portal/${PACKAGE_VERSION}-SNAPSHOT/redbox-portal-${PACKAGE_VERSION}-SNAPSHOT.tgz"
      - run:
          name: Publish amd64 runtime image
          command: |
            docker load -i /tmp/docker-images/redbox-portal-runtime.tar
            echo "${DOCKER_PASS}" | docker login --username "${DOCKER_USER}" --password-stdin
            source support/build/docker-build-vars.sh
            docker tag redbox-portal:runtime "${REPO}:${DEPLOY_TAG}-amd64"
            bash support/build/docker-audit-runtime.sh "${REPO}:${DEPLOY_TAG}-amd64"
            bash support/build/docker-push-digest.sh "${REPO}:${DEPLOY_TAG}-amd64" /tmp/release-digests/runtime-amd64
      - persist_to_workspace:
          root: /tmp
          paths:
            - release-digests/runtime-amd64
  publish-runtime-amd64:
    docker:
      - image: 'cimg/node:26.12.1@sha256:8b451a3ecf9eb810f23612be560c17731d2766f0ad104fff9f5ae7d26d3f061a'
    resource_class: large
    steps:
      - checkout
      - setup_remote_docker
      - run:
          name: Publish amd64 runtime image
          no_output_timeout: 30m
          command: chmod +x support/build/docker-publish-amd64-variant.sh && support/build/docker-publish-amd64-variant.sh runtime ""
      - persist_to_workspace:
          root: /tmp
          paths:
            - release-digests/runtime-amd64
  publish-runtime-arm64:
    machine:
      image: ubuntu-2404:current
    resource_class: arm.medium
    steps:
      - checkout
      - run:
          <<: *selectPatchedNode
      - run:
