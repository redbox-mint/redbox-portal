  test-playwright:
    machine:
      image: ubuntu-2404:current
    resource_class: large
    environment:
      RBPORTAL_IMAGE: redbox-portal:test
    steps:
      - checkout
      - run:
          <<: *selectPatchedNode
      - attach_workspace:
          at: /tmp
      - run:
          name: Load Docker image
          command: docker load -i /tmp/docker-images/redbox-portal-test.tar
      - run:
          name: Point compose at tested image
          command: echo 'export RBPORTAL_IMAGE=redbox-portal:test' >> "$BASH_ENV"
      - restore_cache:
          keys:
            - v1-npm-cache-{{ arch }}-{{ .Branch }}-{{ checksum "package-lock.json" }}
            - v1-npm-cache-{{ arch }}-{{ .Branch }}
            - v1-npm-cache-
      - run:
          name: Install npm dependencies
          command: |
            npm install --global npm@11.20.0 --ignore-scripts --no-audit
            npm ci --ignore-scripts --strict-peer-deps
      - run:
          <<: *installCodecov
      - run:
          name: Setup test directories
          command: |
            sudo mkdir -p coverage/playwright
            sudo mkdir -p .tmp/junit/backend-playwright
            sudo mkdir -p .tmp/playwright/{logs,attachments,email}
            sudo chmod -R 777 .
      - run:
          name: Validate Playwright coverage manifest
          command: npm run test:playwright:check-coverage
      - run:
          name: Record Playwright run metadata
          command: |
            {
              echo "commit=$(git rev-parse HEAD)"
              echo "image=${RBPORTAL_IMAGE}"
              node -p "'playwright=' + require('./package.json').devDependencies['@playwright/test']"
              echo "workers=1"
              echo "retries=0"
              echo "locale=en-AU"
              echo "timezone=Australia/Brisbane"
            } > .tmp/playwright/run-metadata.txt
      - run:
          name: Run complete Playwright regression suite on default Fastify
          no_output_timeout: 30m
          command: timeout 1800s npm run test:playwright:ci
      - run:
          name: Clean up Playwright containers
          command: npm run test:playwright:clean || true
          when: always
      - run:
          name: Upload Playwright code coverage
          command: |
            if [ ! -f ./coverage/playwright/lcov.info ]; then
              echo "Backend coverage is unavailable because the portal did not produce an lcov report. See the browser result and startup logs."
              exit 0
            fi
            sudo chmod -R a+rwX ./coverage
            node support/unit-testing/codecov/prepare-report.cjs "./coverage/playwright/lcov.info"
            /tmp/.codecov-cli/codecov --verbose upload-process --fail-on-error --disable-search \
             --network-root-folder "$(git rev-parse --show-toplevel)" \
             --token "${CODECOV_TOKEN}" --name "job-${CIRCLE_BUILD_NUM}-${CIRCLE_TAG:-$CIRCLE_BRANCH}" \
             --flag "backend-playwright" --file "./coverage/playwright/lcov.info" --branch "${CIRCLE_TAG:-$CIRCLE_BRANCH}"
          when: always
      - store_test_results:
          path: .tmp/junit
      - store_artifacts:
          path: .tmp/playwright
      - save_cache:
          key: v1-npm-cache-{{ arch }}-{{ .Branch }}-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm
