name: pdfgen-development

networks:
  main:

services:
  rbportal:
    build:
      context: "../../../.."
      dockerfile: "Dockerfile"
      target: "rehearsal"
    ports:
      - "1500:1500"
      - "9876:9876"
    volumes:
      - "../../:/opt/redbox-portal/node_modules/@researchdatabox/sails-hook-redbox-pdfgen"
      - "../api-integration-testing:/pdf-fixtures:ro"
      - "pdf-attachments:/attachments"
      - "./.tmp/attachments/staging:/attachments/staging"
    expose:
      - "1500"
    environment:
      - NODE_ENV=integrationtest
      - REDBOX_APPLICATION_CONFIG=/pdf-fixtures/deployment.cjs
      - REDBOX_SESSION_SECRET=pdf-fixture-only-session-secret-at-least-32
      - REDBOX_PUBLIC_URL=http://localhost:1500
      - PORT=1500
    networks:
      main:
        aliases:
          - rbportal
    entrypoint: >-
      /bin/bash -c "set -eu;
      cd /opt/redbox-portal &&
      node app.express.cjs --maintenance=indexes:ensure &&
      exec node --enable-source-maps --inspect=0.0.0.0:9876 app.express.cjs;"

  mongodb:
    ulimits:
      nofile: { soft: 64000, hard: 64000 }
    image: mongo:9.0.4@sha256:dc28ed5a9d0fc616903c3f463bb1e53b92b49f441721b91926e87d90bf957ce8
    networks:
      main:
        aliases:
          - mongodb
    ports:
      - "27017:27017"
    volumes:
      - "../../../../support/resources/mongodb-persistence-indexes.js:/docker-entrypoint-initdb.d/20-persistence-indexes.js:ro"
      - ".tmp/mongo:/data/db"

  solr:
    image: solr:10.0.0@sha256:c2a983cd9a5759c3b802b7b47f48b5cfae2b34d63a9444d62730fdbdb1b5308b
    networks:
      main:
        aliases:
          - solr
    expose:
      - "8983"
    ports:
      - "8983:8983"
    environment:
      - SOLR_HOME=/var/solr/data
    entrypoint:
      - docker-entrypoint.sh
      - solr-precreate
      - redbox

volumes:
  pdf-attachments:
