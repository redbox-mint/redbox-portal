name: pdfgen-bruno

networks:
  main:

x-rbportal-env: &rbportal-env
  - NODE_ENV=production
  - REDBOX_PORT=1500
  - REDBOX_APPLICATION_CONFIG=/pdf-fixtures/deployment.cjs
  - REDBOX_SESSION_SECRET=pdf-fixture-only-session-secret-at-least-32
  - CI=${CI:-false}
  - RBPORTAL_COVERAGE_DIR=/tmp/coverage/mocha

x-rbportal-depends: &rbportal-depends
  mongodb:
    condition: service_healthy
  solr:
    condition: service_healthy

services:
  bruno:
    image: node:26.11.1-bookworm@sha256:f1233c415b41ffcf237c717b3dea92e9d4ea006e0e4c71edcb790605d74f5404
    pull_policy: "missing"
    volumes:
      - "../../.tmp/junit/backend-bruno:/opt/junit/backend-bruno"
      - "../../test/bruno:/opt/bruno-tests"
    working_dir: /opt/bruno-tests
    depends_on:
      redboxportal:
        condition: service_healthy
    networks:
      main:
        aliases:
          - bruno
    entrypoint: >-
      /bin/sh -lc "cd /opt/bruno-tests &&
      npm ci --ignore-scripts &&
      node_modules/.bin/bru run
      --env test
      --format junit
      --output /opt/junit/backend-bruno/backend-bruno.xml
      --bail"

  redboxportal:
    build:
      context: ../../../..
      dockerfile: Dockerfile
      target: rehearsal
    ports:
      - "1500:1500"
    volumes:
      - "./:/pdf-fixtures:ro"
      - "pdf-attachments:/attachments"
    depends_on: *rbportal-depends
    expose:
      - "1500"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:1500/default/rdmp/home"]
      interval: "10s"
      timeout: "5s"
      retries: 10
      start_period: "60s"
    environment: *rbportal-env
    networks:
      main:
        aliases:
          - redboxportal
          - rbportal
    init: true
    entrypoint: >-
      /bin/bash -c "set -eu;
      cd /opt/redbox-portal &&
      node app.express.cjs --maintenance=indexes:ensure &&
      exec node --enable-source-maps app.express.cjs;"

  mongodb:
    volumes:
      - "../../../../support/resources/mongodb-persistence-indexes.js:/docker-entrypoint-initdb.d/20-persistence-indexes.js:ro"
    ulimits:
      nofile: { soft: 64000, hard: 64000 }
    image: mongo:9.0.4@sha256:dc28ed5a9d0fc616903c3f463bb1e53b92b49f441721b91926e87d90bf957ce8
    networks:
      main:
        aliases:
          - mongodb
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD-SHELL", 'echo ''db.runCommand("ping").ok'' | mongosh']
      interval: "10s"
      timeout: "5s"
      retries: 10
      start_period: "30s"

  solr:
    image: solr:10.0.0@sha256:c2a983cd9a5759c3b802b7b47f48b5cfae2b34d63a9444d62730fdbdb1b5308b
    expose:
      - "8983"
    ports:
      - "8983:8983"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8983"]
      interval: "10s"
      timeout: "5s"
      retries: 10
      start_period: "30s"
    networks:
      main:
        aliases:
          - solr
    entrypoint:
      - docker-entrypoint.sh
      - solr-precreate
      - redbox

volumes:
  pdf-attachments:
